name: Build

on:
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      VERSION: 1.${{ vars.MAJOR }}.${{ vars.MINOR }}
    permissions:
      actions: write
      packages: write
      contents: read
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      -
        name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          context: git
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKERHUB_REPO }}
          tags: |
            type=raw,value=latest,priority=100
            type=raw,value=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.title=Helios
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login into Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION_ARG=${{ env.VERSION }}
      -
        name: Export binary
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}:${VERSION}"
          docker pull "$image"
          container="$(docker create "$image" true)"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "$container:/usr/bin/qemu-system-x86_64" ./qemu-system-x86_64
          chmod 755 ./qemu-system-x86_64
          test -s ./qemu-system-x86_64
          sha256sum ./qemu-system-x86_64
      -
        name: Create a release
        uses: action-pack/github-release@v2
        with:
          tag: "v${{ env.VERSION }}"
          title: "v${{ env.VERSION }}"
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
      -
        name: Upload binary to release
        env:
          GH_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
        run: gh release upload "v${VERSION}" ./qemu-system-x86_64 --clobber
      -
        name: Increment version variable
        uses: action-pack/increment@v2
        with:
          name: 'MINOR'
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
      -
        name: Send mail
        uses: action-pack/send-mail@v1
        with:
          to: ${{secrets.MAILTO}}
          from: Github Actions <${{secrets.MAILTO}}>
          connection_url: ${{secrets.MAIL_CONNECTION}}
          subject: Build of ${{ github.event.repository.name }} v${{ env.VERSION }} completed
          body: |
              The build job of ${{ github.event.repository.name }} v${{ env.VERSION }} was completed successfully!

              See https://github.com/${{ github.repository }}/actions for more information.
